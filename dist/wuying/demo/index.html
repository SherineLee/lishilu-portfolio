<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="物映发圈交互示例：查看商品精修、风格参考、场景成片和改稿流程。">
  <meta name="theme-color" content="#f2f4f7">
  <title>物映 · 发圈交互示例</title>
  <link rel="stylesheet" href="demo.css">
  <script src="demo.js" defer></script>
</head>
<body>
  <header>
    <div class="brand"><span class="mark">物</span>物映 <span class="brand-sub">小物件商品图助手</span></div>
    <div class="header-right"><a class="demo-back" href="../../#commerce">返回案例 ↗</a></div>
  </header>
  <nav class="steps" aria-label="制作进度">
    <div class="step active"><b>1</b>上传商品</div>
    <div class="step"><b>2</b>精修确认</div>
    <div class="step"><b>3</b>生成场景</div>
    <div class="step"><b>4</b>调整导出</div>
  </nav>
  <main id="workspace" class="workspace">
    <div class="demo-heading">
      <h1>用一只格纹发圈，走一遍改稿流程。</h1>
      <p>使用预置图片，不上传、不调用生图。可以逐步查看，并下载示例成片。</p>
    </div>
    <section class="demo-body">
      <aside class="panel demo-panel" aria-live="polite">
        <span class="demo-count" id="demo-count">01 / 04</span>
        <h2 id="demo-title">从一张随手拍开始</h2>
        <p id="demo-copy">原图会保留。后续精修如果不像原来的商品，可以随时退回来。</p>
        <div class="demo-detail" id="demo-detail"><span>检查重点</span><p>格纹、颜色、轮廓</p></div>
        <div class="demo-revise" id="demo-revise" hidden>
          <span>选择一条修改说明</span>
          <button data-revise="减少桌面道具，保留发圈位置与纹样。">背景再干净一点</button>
          <button data-revise="提高商品与背景的明暗对比，不改变商品主色。">商品再突出一点</button>
          <p id="demo-revise-copy">选择后可查看具体修改说明；公开示例不会生成新图片。</p>
        </div>
        <div class="demo-actions">
          <button class="primary demo-next" id="demo-next">查看精修示例 →</button>
          <a class="demo-download" id="demo-download" href="../assets/result.webp" download="物映-发圈场景示例.webp" hidden>下载示例图 ↓</a>
        </div>
      </aside>
      <div class="canvas">
        <div class="canvas-frame">
          <img id="demo-image" src="../assets/original.webp" alt="手持格纹发圈的原始照片">
          <span class="demo-image-label" id="demo-image-label">原始照片</span>
        </div>
      </div>
    </section>
    <p class="demo-footnote">精修与成片为预置素材；完整原型中的真实生成能力不在这个静态示例内运行。</p>
  </main>
</body>
</html>
