[build]
  publish = "dist"
  functions = "netlify/functions"
[functions]
  node_bundler = "esbuild"
[[redirects]]
  from = "/api/commerce"
  to = "/.netlify/functions/commerce"
  status = 200

[functions.chat]
  included_files = ["api/knowledge/*.md"]
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
